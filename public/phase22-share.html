<!doctype html>
<html><head><meta charset="utf-8"><title>phase22-share</title>
<style>html,body{margin:0;background:#0B0B10;color:#E6E6EC;font:11px/1.4 ui-monospace,monospace;padding:6px}</style>
</head><body>
<pre id="o">running…</pre>
<iframe id="f"></iframe>
<script>
const w = parseInt(new URLSearchParams(location.search).get("w") || "1280", 10);
const f = document.getElementById("f");
f.style.cssText = `display:block;width:${w}px;height:3800px;border:0`;
f.src = "http://127.0.0.1:3939/u/noir?" + Date.now();
f.addEventListener("load", () => {
  setTimeout(async () => {
    try {
      const doc = f.contentDocument;
      try { await doc.fonts.ready; } catch (e) {}
      const btn = doc.getElementById('share-profile-btn');
      const dialog = () => doc.querySelector('[role="dialog"][aria-modal="true"]');
      const out = {
        shareBtnPresent: !!btn,
        shareBtnLabel: btn?.innerText?.trim() || null,
        dialogInitiallyPresent: !!dialog(),
        currentOrigin: f.contentWindow.location.origin,
      };
      if (btn) {
        btn.click();
        await new Promise(r => setTimeout(r, 600));
        const d = dialog();
        out.afterClickDialogPresent = !!d;
        out.afterClickDialogUrlInput = d?.querySelector('input')?.value || null;
        const esc = new KeyboardEvent('keydown', { key: 'Escape' });
        d?.dispatchEvent(esc);
        await new Promise(r => setTimeout(r, 300));
        out.afterEsc = !!dialog();
      }
      document.getElementById("o").textContent = JSON.stringify(out, null, 2);
      document.title = "share w=" + w;
    } catch (e) {
      document.getElementById("o").textContent = "ERR " + e;
    }
  }, 1500);
});
</script>
</body></html>
