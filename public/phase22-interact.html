<!doctype html>
<html><head><meta charset="utf-8"><title>phase22-interact</title>
<style>html,body{margin:0;background:#0B0B10;color:#E6E6EC;font:11px/1.4 ui-monospace,monospace;padding:6px}</style>
</head><body>
<pre id="o">running…</pre>
<iframe id="f"></iframe>
<script>
const w = parseInt(new URLSearchParams(location.search).get("w") || "1280", 10);
const phase = new URLSearchParams(location.search).get("phase") || "listen";
const f = document.getElementById("f");
f.style.cssText = `display:block;width:${w}px;height:3800px;border:0`;
f.src = "http://127.0.0.1:3939/u/noir?" + Date.now();
f.addEventListener("load", () => {
  setTimeout(async () => {
    try {
      const doc = f.contentDocument;
      try { await doc.fonts.ready; } catch (e) {}
      const st = doc.querySelector('[data-testid="profile-soundtrack"]');
      const listenBtn = () => st?.querySelector('button[aria-label^="Listen"]');
      const stopBtn = () => st?.querySelector('button[aria-label="Stop playback"]');
      const iframe = () => st?.querySelector('iframe');
      const status = () => st?.querySelector('[role="status"]')?.innerText;
      const dump = () => {
        const ifEl = iframe();
        const out = {
          soundtrackPresent: !!st,
          hasListenBtn: !!listenBtn(),
          hasStopBtn: !!stopBtn(),
          iframePresent: !!ifEl,
          iframeSrc: ifEl?.src || null,
          iframeVisible: ifEl ? ifEl.getBoundingClientRect().height > 0 : false,
          status: status(),
        };
        document.getElementById("o").textContent = JSON.stringify(out, null, 2);
        return out;
      };
      if (phase === "initial") {
        dump();
        document.title = "initial w=" + w;
      } else if (phase === "listen") {
        listenBtn()?.click();
        await new Promise(r => setTimeout(r, 1500));
        const r = dump();
        document.title = "listened w=" + w;
      } else if (phase === "stop") {
        listenBtn()?.click();
        await new Promise(r => setTimeout(r, 1500));
        const before = {
          iframePresent: !!iframe(),
          iframeSrc: iframe()?.src || null,
        };
        stopBtn()?.click();
        await new Promise(r => setTimeout(r, 600));
        const after = {
          iframePresent: !!iframe(),
          hasListenBtn: !!listenBtn(),
        };
        const out = { before, after, status: status() };
        document.getElementById("o").textContent = JSON.stringify(out, null, 2);
        document.title = "stopped w=" + w;
      }
    } catch (e) {
      document.getElementById("o").textContent = "ERR " + e;
    }
  }, 1500);
});
</script>
</body></html>
